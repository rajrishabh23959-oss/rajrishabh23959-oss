<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 170" width="100%" height="100%">
  <defs>
    <style>
      :root {
        --bg: #F9F8F5;
        --card: #FFFFFF;
        --border: #DCD8CE;
        --text-primary: #0E1624;
        --text-secondary: #5C6675;
        --text-muted: #8893A2;
        --accent: #B08D57;
      }
      .fm-serif-lt { font-family: Georgia, 'Palatino Linotype', Palatino, serif; font-size: 16px; font-weight: 700; fill: #0E1624; }
      .fm-sans-lt { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .fm-mono-lt { font-family: -apple-system, BlinkMacSystemFont, 'SF Mono', 'Fira Code', 'Courier New', monospace; }
      
      .fm-tag-lt { font-size: 8.5px; font-weight: 700; fill: #B08D57; letter-spacing: 1.5px; text-transform: uppercase; }
      .fm-sub-lt { font-size: 11px; font-weight: 400; fill: #5C6675; }
      .fm-metric-label-lt { font-size: 8px; font-weight: 600; fill: #8893A2; letter-spacing: 1.2px; text-transform: uppercase; }
      .fm-metric-val-lt { font-family: Georgia, serif; font-size: 13.5px; font-weight: 700; fill: #0E1624; }
      .fm-footer-lt { font-size: 8px; font-weight: 600; fill: #8893A2; letter-spacing: 1.2px; text-transform: uppercase; }
    </style>
  </defs>

  <!-- Base Container -->
  <rect width="900" height="170" fill="#F9F8F5" />

  <!-- CARD 1: SENTINAI -->
  <g transform="translate(14, 10)">
    <rect width="278" height="150" rx="6" fill="#FFFFFF" stroke="#DCD8CE" stroke-width="1" />
    <text x="18" y="26" class="fm-mono-lt fm-tag-lt">SPEC 01 // BIOMETRICS</text>
    <text x="18" y="52" class="fm-serif-lt">SentinAI Protocol</text>
    <text x="18" y="70" class="fm-sans-lt fm-sub-lt">Keystroke Dynamic Verification</text>

    <!-- Financial Report Style Progress Bar -->
    <text x="18" y="102" class="fm-mono-lt fm-metric-label-lt">VERIFICATION RATE</text>
    <text x="260" y="102" text-anchor="end" class="fm-metric-val-lt">99.4%</text>
    <line x1="18" y1="110" x2="260" y2="110" stroke="#E5E0D5" stroke-width="2" />
    <line x1="18" y1="110" x2="242" y2="110" stroke="#B08D57" stroke-width="2" />

    <text x="18" y="136" class="fm-mono-lt fm-footer-lt">NATIONAL IDEATHON DEFENSE</text>
  </g>

  <!-- CARD 2: RENOPAY -->
  <g transform="translate(310, 10)">
    <rect width="280" height="150" rx="6" fill="#FFFFFF" stroke="#DCD8CE" stroke-width="1" />
    <text x="18" y="26" class="fm-mono-lt fm-tag-lt">SPEC 02 // PAYMENT ENGINE</text>
    <text x="18" y="52" class="fm-serif-lt">RenoPay Architecture</text>
    <text x="18" y="70" class="fm-sans-lt fm-sub-lt">UPI Lite &amp; Double-Entry Ledger</text>

    <text x="18" y="102" class="fm-mono-lt fm-metric-label-lt">DEPLOYMENT RUNTIME</text>
    <text x="262" y="102" text-anchor="end" class="fm-metric-val-lt" fill="#B08D57">LIVE PROD</text>
    <line x1="18" y1="110" x2="262" y2="110" stroke="#E5E0D5" stroke-width="2" />
    <line x1="18" y1="110" x2="228" y2="110" stroke="#B08D57" stroke-width="2" />

    <text x="18" y="136" class="fm-mono-lt fm-footer-lt">DOCKER · NGINX · RENDER HOSTED</text>
  </g>

  <!-- CARD 3: ACADEMIC & CSBS RIGOR -->
  <g transform="translate(608, 10)">
    <rect width="278" height="150" rx="6" fill="#FFFFFF" stroke="#DCD8CE" stroke-width="1" />
    <text x="18" y="26" class="fm-mono-lt fm-tag-lt">SPEC 03 // QUANTITATIVE</text>
    <text x="18" y="52" class="fm-serif-lt">CSBS Dual Rigor</text>
    <text x="18" y="70" class="fm-sans-lt fm-sub-lt">Mathematics &amp; Financial Accounting</text>

    <text x="18" y="102" class="fm-mono-lt fm-metric-label-lt">ACADEMIC SGPA</text>
    <text x="260" y="102" text-anchor="end" class="fm-metric-val-lt">9.25 / 10</text>
    <line x1="18" y1="110" x2="260" y2="110" stroke="#E5E0D5" stroke-width="2" />
    <line x1="18" y1="110" x2="248" y2="110" stroke="#B08D57" stroke-width="2" />

    <text x="18" y="136" class="fm-mono-lt fm-footer-lt">100/100 MATH · JEE ADVANCED 2X</text>
  </g>
</svg>

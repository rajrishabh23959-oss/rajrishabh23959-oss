<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="50%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#070C1B" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="30%" stop-color="#2DD4BF" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#0284C7" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#FCD34D" />
    </linearGradient>

    <!-- Sparkline Gradient -->
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0EA5E9" />
      <stop offset="60%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <linearGradient id="chartArea" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#2DD4BF" stop-opacity="0" />
    </linearGradient>

    <!-- Filter for Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .terminal-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace; font-size: 11px; fill: #64748B; font-weight: 600; letter-spacing: 1.5px; }
    .status-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace; font-size: 11px; fill: #10B981; font-weight: 700; letter-spacing: 1px; }
    .hero-name { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 40px; font-weight: 900; letter-spacing: -0.5px; fill: url(#textGrad); }
    .hero-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; font-weight: 600; fill: #E2E8F0; letter-spacing: 0.5px; }
    .hero-desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; fill: #94A3B8; }
    .tag-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace; font-size: 10px; font-weight: 600; fill: #2DD4BF; letter-spacing: 0.8px; }
    .metric-val { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; font-weight: 800; fill: #F8FAFC; }
    .metric-lbl { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace; font-size: 9px; fill: #64748B; font-weight: 600; letter-spacing: 0.6px; }

    @keyframes pulsePoint {
      0% { r: 3.5px; opacity: 1; }
      50% { r: 7.5px; opacity: 0.2; }
      100% { r: 3.5px; opacity: 1; }
    }
    .pulsing-node {
      animation: pulsePoint 2.4s infinite ease-in-out;
    }
  </style>

  <!-- Container -->
  <rect x="2" y="2" width="896" height="256" rx="14" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Top Dashboard Bar -->
  <path d="M 2 16 Q 2 2 16 2 L 884 2 Q 898 2 898 16 L 898 38 L 2 38 Z" fill="#0D1528" fill-opacity="0.8" />
  <line x1="2" y1="38" x2="898" y2="38" stroke="#1E293B" stroke-width="1" />

  <!-- Window controls -->
  <circle cx="22" cy="20" r="5" fill="#EF4444" />
  <circle cx="38" cy="20" r="5" fill="#F59E0B" />
  <circle cx="54" cy="20" r="5" fill="#10B981" />

  <!-- Terminal Label -->
  <text x="80" y="24" class="terminal-title">RISHABH-TERMINAL // FINTECH &amp; AI INTELLIGENCE SYSTEM</text>

  <!-- Live Status Beacon -->
  <circle cx="750" cy="20" r="4" fill="#10B981" />
  <circle cx="750" cy="20" r="7" fill="none" stroke="#10B981" stroke-width="1.2" opacity="0.6">
    <animate attributeName="r" values="4;9;4" dur="2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.8;0;0.8" dur="2s" repeatCount="indefinite" />
  </circle>
  <text x="765" y="24" class="status-text">LIVE · 99.98% UPTIME</text>

  <!-- Left Content Area -->
  <!-- Focus Tag -->
  <rect x="28" y="54" width="370" height="24" rx="12" fill="#0F243A" stroke="#0284C7" stroke-width="1" stroke-opacity="0.7" />
  <text x="42" y="70" class="tag-text">◈ B.TECH + MBA (CSBS) · PONDICHERRY UNIVERSITY</text>

  <!-- Name -->
  <text x="28" y="118" class="hero-name">RISHABH RAJ</text>

  <!-- Subtitle -->
  <text x="28" y="145" class="hero-sub">AI &amp; FinTech Analyst · Digital Banking · Fraud Analytics</text>
  <text x="28" y="167" class="hero-desc">Engineering resilient financial rails, keystroke biometrics, and AI-driven double-entry ledgers.</text>

  <!-- Operational Badges (Row) -->
  <g transform="translate(28, 186)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="138" height="48" rx="8" fill="#0D1829" stroke="#1E293B" stroke-width="1" />
    <text x="12" y="20" class="metric-lbl">ACADEMIC EXCELLENCE</text>
    <text x="12" y="38" class="metric-val" fill="#38BDF8">SGPA 9.25 / 10</text>

    <!-- Pill 2 -->
    <rect x="148" y="0" width="144" height="48" rx="8" fill="#0D1829" stroke="#1E293B" stroke-width="1" />
    <text x="160" y="20" class="metric-lbl">MATHEMATICS RANK</text>
    <text x="160" y="38" class="metric-val" fill="#FCD34D">100/100 · JEE (2X)</text>

    <!-- Pill 3 -->
    <rect x="302" y="0" width="154" height="48" rx="8" fill="#0D1829" stroke="#1E293B" stroke-width="1" />
    <text x="314" y="20" class="metric-lbl">CORE PROTOCOLS</text>
    <text x="314" y="38" class="metric-val" fill="#2DD4BF">UPI · AI BOOKKEEPING</text>
  </g>

  <!-- Right Chart & Telemetry Box -->
  <g transform="translate(496, 52)">
    <rect x="0" y="0" width="374" height="182" rx="10" fill="#0A1120" stroke="#1E293B" stroke-width="1" />

    <!-- Grid Lines -->
    <line x1="20" y1="36" x2="354" y2="36" stroke="#162238" stroke-dasharray="3 3" />
    <line x1="20" y1="76" x2="354" y2="76" stroke="#162238" stroke-dasharray="3 3" />
    <line x1="20" y1="116" x2="354" y2="116" stroke="#162238" stroke-dasharray="3 3" />

    <text x="20" y="22" class="terminal-title">BEHAVIORAL RISK &amp; TRANSACTION PULSE</text>
    <text x="280" y="22" class="tag-text" fill="#10B981">SENTINAI ACTIVE</text>

    <!-- Sparkline Fill Area -->
    <path d="M 20 120 Q 70 110, 110 85 T 180 95 T 250 50 T 310 65 T 350 40 L 350 148 L 20 148 Z" fill="url(#chartArea)" />

    <!-- Sparkline Path -->
    <path d="M 20 120 Q 70 110, 110 85 T 180 95 T 250 50 T 310 65 T 350 40" fill="none" stroke="url(#chartGrad)" stroke-width="2.5" filter="url(#glow)">
      <animate attributeName="stroke-dasharray" values="0,600; 600,0" dur="2.5s" fill="freeze" />
    </path>

    <!-- Data Nodes -->
    <circle cx="110" cy="85" r="3.5" fill="#38BDF8" />
    <circle cx="180" cy="95" r="3.5" fill="#2DD4BF" />
    <circle cx="250" cy="50" r="3.5" fill="#FCD34D" />
    <circle cx="350" cy="40" r="4.5" fill="#F59E0B" />
    <circle cx="350" cy="40" r="8" fill="none" stroke="#F59E0B" stroke-width="1.5" class="pulsing-node" />

    <!-- Mini Telemetry footer inside chart box -->
    <line x1="10" y1="148" x2="364" y2="148" stroke="#162238" />
    <text x="20" y="168" class="metric-lbl">TARGET: AI/FINTECH ANALYST</text>
    <text x="210" y="168" class="tag-text">READY FOR DEPLOYMENT →</text>
  </g>
</svg>

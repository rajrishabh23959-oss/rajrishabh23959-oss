<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 170" width="100%" height="100%">
  <defs>
    <!-- Background Card Canvas (Light) -->
    <linearGradient id="achCardLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>

    <!-- Gradients -->
    <linearGradient id="glowGoldLt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="glowTealLt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#14B8A6" />
    </linearGradient>
    <linearGradient id="glowCyanLt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="glowPurpleLt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <linearGradient id="glowEmeraldLt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
  </defs>

  <style>
    .track-title-lt { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'SF Mono', monospace; font-size: 10px; fill: #64748B; font-weight: 700; letter-spacing: 0.8px; }
    .card-head-lt { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14.5px; fill: #0F172A; font-weight: 800; }
    .card-metric-lt { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'SF Mono', monospace; font-size: 13px; font-weight: 800; letter-spacing: 0.2px; }
    .card-detail-lt { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; fill: #475569; }
    .badge-label-lt { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'SF Mono', monospace; font-size: 9px; font-weight: 700; letter-spacing: 0.4px; }
  </style>

  <!-- ==================== CARD 1: JEE ADVANCED (2X) ==================== -->
  <g transform="translate(10, 8)">
    <rect width="168" height="154" rx="10" fill="url(#achCardLight)" stroke="#CBD5E1" stroke-width="1.2" />
    <rect width="168" height="154" rx="10" fill="none" stroke="#D97706" stroke-opacity="0.3" stroke-width="1">
      <animate attributeName="stroke-opacity" values="0.15;0.5;0.15" dur="3s" repeatCount="indefinite" />
    </rect>

    <text x="14" y="24" class="track-title-lt">HONOR 01</text>
    <rect x="76" y="13" width="78" height="17" rx="8.5" fill="#FEF3C7" stroke="#D97706" stroke-width="0.8" />
    <text x="83" y="25" class="badge-label-lt" fill="#B45309">QUALIFIED 2X</text>

    <text x="14" y="52" class="card-head-lt">JEE Advanced</text>
    <text x="14" y="69" class="card-detail-lt">Qualifier 2024 &amp; 2025</text>

    <text x="14" y="98" class="track-title-lt">NATIONAL BENCHMARK</text>
    <text x="14" y="117" class="card-metric-lt" fill="#B45309">2x Qualifier</text>

    <!-- Progress bar -->
    <rect x="14" y="125" width="140" height="5" rx="2.5" fill="#E2E8F0" />
    <rect x="14" y="125" width="136" height="5" rx="2.5" fill="url(#glowGoldLt)">
      <animate attributeName="width" values="20;136" dur="1.6s" fill="freeze" />
    </rect>
    <text x="14" y="146" class="track-title-lt" fill="#B45309">PREMIER PERCENTILE</text>
  </g>

  <!-- ==================== CARD 2: 100/100 MATHS ==================== -->
  <g transform="translate(188, 8)">
    <rect width="168" height="154" rx="10" fill="url(#achCardLight)" stroke="#CBD5E1" stroke-width="1.2" />
    <rect width="168" height="154" rx="10" fill="none" stroke="#0D9488" stroke-opacity="0.3" stroke-width="1">
      <animate attributeName="stroke-opacity" values="0.15;0.5;0.15" dur="3s" begin="0.6s" repeatCount="indefinite" />
    </rect>

    <text x="14" y="24" class="track-title-lt">HONOR 02</text>
    <rect x="78" y="13" width="76" height="17" rx="8.5" fill="#CCFBF1" stroke="#0D9488" stroke-width="0.8" />
    <text x="85" y="25" class="badge-label-lt" fill="#0F766E">PERFECT 100</text>

    <text x="14" y="52" class="card-head-lt">Mathematics</text>
    <text x="14" y="69" class="card-detail-lt">100/100 Raw Score</text>

    <text x="14" y="98" class="track-title-lt">QUANTITATIVE RIGOR</text>
    <text x="14" y="117" class="card-metric-lt" fill="#0F766E">100 / 100 in Maths</text>

    <!-- Progress bar -->
    <rect x="14" y="125" width="140" height="5" rx="2.5" fill="#E2E8F0" />
    <rect x="14" y="125" width="140" height="5" rx="2.5" fill="url(#glowTealLt)">
      <animate attributeName="width" values="20;140" dur="1.6s" fill="freeze" />
    </rect>
    <text x="14" y="146" class="track-title-lt" fill="#0F766E">FLAWLESS SCORE</text>
  </g>

  <!-- ==================== CARD 3: SGPA 9.25 ==================== -->
  <g transform="translate(366, 8)">
    <rect width="168" height="154" rx="10" fill="url(#achCardLight)" stroke="#CBD5E1" stroke-width="1.2" />
    <rect width="168" height="154" rx="10" fill="none" stroke="#0284C7" stroke-opacity="0.3" stroke-width="1">
      <animate attributeName="stroke-opacity" values="0.15;0.5;0.15" dur="3s" begin="1.2s" repeatCount="indefinite" />
    </rect>

    <text x="14" y="24" class="track-title-lt">HONOR 03</text>
    <rect x="80" y="13" width="74" height="17" rx="8.5" fill="#E0F2FE" stroke="#0284C7" stroke-width="0.8" />
    <text x="87" y="25" class="badge-label-lt" fill="#0369A1">CSBS HONORS</text>

    <text x="14" y="52" class="card-head-lt">University SGPA</text>
    <text x="14" y="69" class="card-detail-lt">Pondicherry CSBS</text>

    <text x="14" y="98" class="track-title-lt">ACADEMIC INDEX</text>
    <text x="14" y="117" class="card-metric-lt" fill="#0369A1">SGPA 9.25</text>

    <!-- Progress bar -->
    <rect x="14" y="125" width="140" height="5" rx="2.5" fill="#E2E8F0" />
    <rect x="14" y="125" width="130" height="5" rx="2.5" fill="url(#glowCyanLt)">
      <animate attributeName="width" values="20;130" dur="1.6s" fill="freeze" />
    </rect>
    <text x="14" y="146" class="track-title-lt" fill="#0369A1">SEMESTERS 1 &amp; 2</text>
  </g>

  <!-- ==================== CARD 4: PRAGYAN NIT TRICHY ==================== -->
  <g transform="translate(544, 8)">
    <rect width="168" height="154" rx="10" fill="url(#achCardLight)" stroke="#CBD5E1" stroke-width="1.2" />
    <rect width="168" height="154" rx="10" fill="none" stroke="#7C3AED" stroke-opacity="0.3" stroke-width="1">
      <animate attributeName="stroke-opacity" values="0.15;0.5;0.15" dur="3s" begin="1.8s" repeatCount="indefinite" />
    </rect>

    <text x="14" y="24" class="track-title-lt">HONOR 04</text>
    <rect x="76" y="13" width="78" height="17" rx="8.5" fill="#F3E8FF" stroke="#7C3AED" stroke-width="0.8" />
    <text x="83" y="25" class="badge-label-lt" fill="#6D28D9">NIT TRICHY</text>

    <text x="14" y="52" class="card-head-lt">Pragyan Fest</text>
    <text x="14" y="69" class="card-detail-lt">Participant NIT Trichy</text>

    <text x="14" y="98" class="track-title-lt">TECH FESTIVAL</text>
    <text x="14" y="117" class="card-metric-lt" fill="#6D28D9">Pragyan NIT Trichy</text>

    <!-- Progress bar -->
    <rect x="14" y="125" width="140" height="5" rx="2.5" fill="#E2E8F0" />
    <rect x="14" y="125" width="126" height="5" rx="2.5" fill="url(#glowPurpleLt)">
      <animate attributeName="width" values="20;126" dur="1.6s" fill="freeze" />
    </rect>
    <text x="14" y="146" class="track-title-lt" fill="#6D28D9">TECH SUMMIT PARTICIPANT</text>
  </g>

  <!-- ==================== CARD 5: RENOPAY LIVE ON RENDER ==================== -->
  <g transform="translate(722, 8)">
    <rect width="168" height="154" rx="10" fill="url(#achCardLight)" stroke="#CBD5E1" stroke-width="1.2" />
    <rect width="168" height="154" rx="10" fill="none" stroke="#059669" stroke-opacity="0.3" stroke-width="1">
      <animate attributeName="stroke-opacity" values="0.15;0.5;0.15" dur="3s" begin="2.4s" repeatCount="indefinite" />
    </rect>

    <text x="14" y="24" class="track-title-lt">HONOR 05</text>
    <rect x="76" y="13" width="78" height="17" rx="8.5" fill="#D1FAE5" stroke="#059669" stroke-width="0.8" />
    <text x="83" y="25" class="badge-label-lt" fill="#047857">PROD LIVE</text>

    <text x="14" y="52" class="card-head-lt">RenoPay Rails</text>
    <text x="14" y="69" class="card-detail-lt">UPI Engine &amp; Ledgers</text>

    <text x="14" y="98" class="track-title-lt">DEPLOYMENT STATUS</text>
    <text x="14" y="117" class="card-metric-lt" fill="#047857">Live on Render</text>

    <!-- Progress bar -->
    <rect x="14" y="125" width="140" height="5" rx="2.5" fill="#E2E8F0" />
    <rect x="14" y="125" width="138" height="5" rx="2.5" fill="url(#glowEmeraldLt)">
      <animate attributeName="width" values="20;138" dur="1.6s" fill="freeze" />
    </rect>
    <text x="14" y="146" class="track-title-lt" fill="#047857">CLOUD INFRASTRUCTURE</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="100%" height="100%">
  <defs>
    <style>
      :root {
        --bg: #F9F8F5;
        --card: #FFFFFF;
        --border: #DCD8CE;
        --text-primary: #0E1624;
        --text-secondary: #5C6675;
        --text-muted: #8893A2;
        --accent: #B08D57;
      }
      .serif-title-lt { font-family: Georgia, 'Palatino Linotype', Palatino, 'Times New Roman', serif; font-size: 30px; font-weight: 700; fill: #0E1624; letter-spacing: 0.5px; }
      .sans-body-lt { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .mono-meta-lt { font-family: -apple-system, BlinkMacSystemFont, 'SF Mono', 'Fira Code', 'Courier New', monospace; }
      
      .brand-tier-lt { font-size: 10px; font-weight: 600; fill: #B08D57; letter-spacing: 2.2px; text-transform: uppercase; }
      .brand-sub-lt { font-size: 8.5px; font-weight: 500; fill: #8893A2; letter-spacing: 1.2px; text-transform: uppercase; }
      .card-sub-lt { font-size: 11px; font-weight: 500; fill: #5C6675; letter-spacing: 0.5px; }
      .card-focus-lt { font-size: 10px; font-weight: 500; fill: #B08D57; letter-spacing: 0.8px; }
      
      .metric-tag-lt { font-size: 8px; font-weight: 700; fill: #8893A2; letter-spacing: 1.5px; text-transform: uppercase; }
      .metric-number-lt { font-family: Georgia, serif; font-size: 16px; font-weight: 700; fill: #0E1624; letter-spacing: 0.3px; }
      .metric-desc-lt { font-size: 8.5px; font-weight: 500; fill: #5C6675; }
    </style>
  </defs>

  <!-- Editorial Canvas Background -->
  <rect width="900" height="360" fill="#F9F8F5" />

  <!-- Subtle Editorial Margin Frame (1px border) -->
  <rect x="24" y="16" width="852" height="328" fill="none" stroke="#DCD8CE" stroke-width="1" stroke-opacity="0.6" />

  <!-- Card Surface -->
  <g transform="translate(170, 26)">
    <!-- Main Card Body -->
    <rect width="560" height="308" rx="8" fill="#FFFFFF" stroke="#DCD8CE" stroke-width="1" />

    <!-- Top Accent Hairline -->
    <line x1="28" y1="0" x2="140" y2="0" stroke="#B08D57" stroke-width="2" />

    <!-- 1. HEADER ROW: CHIP, CONTACTLESS & EDITORIAL LOGO -->
    <g transform="translate(32, 28)">
      <!-- EMV Microchip in Matte Brass -->
      <rect x="0" y="0" width="42" height="32" rx="4" fill="#B08D57" />
      <line x1="0" y1="16" x2="42" y2="16" stroke="#FFFFFF" stroke-width="1" />
      <line x1="14" y1="0" x2="14" y2="32" stroke="#FFFFFF" stroke-width="1" />
      <line x1="28" y1="0" x2="28" y2="32" stroke="#FFFFFF" stroke-width="1" />
      <circle cx="21" cy="16" r="3" fill="#FFFFFF" />

      <!-- Contactless Wave Icon (Matte Brass) -->
      <g transform="translate(52, 6)" stroke="#B08D57" stroke-width="1.4" fill="none" stroke-linecap="round">
        <path d="M 0 5 A 8 8 0 0 1 0 15" />
        <path d="M 4 2 A 13 13 0 0 1 4 18" />
        <path d="M 8 -1 A 18 18 0 0 1 8 21" />
      </g>
    </g>

    <!-- Top Right Editorial Mark -->
    <text x="528" y="42" text-anchor="end" class="mono-meta-lt brand-tier-lt">AI × FINTECH</text>
    <text x="528" y="55" text-anchor="end" class="mono-meta-lt brand-sub-lt">PORTFOLIO DOSSIER</text>

    <!-- 2. IDENTITY SECTION -->
    <g transform="translate(32, 118)">
      <text x="0" y="0" class="serif-title-lt">Rishabh Raj</text>
      <text x="0" y="24" class="mono-meta-lt card-sub-lt">B.TECH + MBA (CSBS) · PONDICHERRY UNIVERSITY (2025–2030)</text>
      <text x="0" y="44" class="sans-body-lt card-focus-lt">Focus: Fraud Analytics · Digital Banking · Behavioral Biometrics</text>
    </g>

    <!-- Horizontal Separator Hairline -->
    <line x1="32" y1="202" x2="528" y2="202" stroke="#E5E0D5" stroke-width="1" />

    <!-- 3. VERIFIED ACADEMIC & QUANTITATIVE RECORD (FLAT COLUMNS) -->
    <g transform="translate(32, 226)">
      <!-- Metric 1: SGPA -->
      <g transform="translate(0, 0)">
        <text x="0" y="0" class="mono-meta-lt metric-tag-lt">ACADEMIC STANDING</text>
        <text x="0" y="20" class="metric-number-lt">9.25 / 10</text>
        <text x="0" y="34" class="sans-body-lt metric-desc-lt">Sem 1: 9.23 · Sem 2: 9.25</text>
      </g>

      <!-- Column Divider 1 -->
      <line x1="160" y1="-4" x2="160" y2="40" stroke="#E5E0D5" stroke-width="1" />

      <!-- Metric 2: Mathematics -->
      <g transform="translate(180, 0)">
        <text x="0" y="0" class="mono-meta-lt metric-tag-lt">QUANTITATIVE RECORD</text>
        <text x="0" y="20" class="metric-number-lt" fill="#B08D57">100 / 100</text>
        <text x="0" y="34" class="sans-body-lt metric-desc-lt">Intermediate Mathematics</text>
      </g>

      <!-- Column Divider 2 -->
      <line x1="340" y1="-4" x2="340" y2="40" stroke="#E5E0D5" stroke-width="1" />

      <!-- Metric 3: National Entrance -->
      <g transform="translate(360, 0)">
        <text x="0" y="0" class="mono-meta-lt metric-tag-lt">NATIONAL COMPETITION</text>
        <text x="0" y="20" class="metric-number-lt">JEE Advanced</text>
        <text x="0" y="34" class="sans-body-lt metric-desc-lt">Qualified 2X (2024 &amp; 2025)</text>
      </g>
    </g>
  </g>
</svg>

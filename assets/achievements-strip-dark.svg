<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 130" width="100%" height="100%">
  <defs>
    <style>
      :root {
        --bg: #0E1624;
        --card: #141F33;
        --border: #23314B;
        --text-primary: #E8E4D8;
        --text-secondary: #8E99A8;
        --text-muted: #5D6A7D;
        --accent: #B08D57;
      }
      .as-tag { font-family: -apple-system, BlinkMacSystemFont, 'SF Mono', 'Fira Code', monospace; font-size: 8px; font-weight: 700; fill: #B08D57; letter-spacing: 1.2px; text-transform: uppercase; }
      .as-label { font-family: -apple-system, BlinkMacSystemFont, 'SF Mono', 'Fira Code', monospace; font-size: 8px; font-weight: 600; fill: #5D6A7D; letter-spacing: 1px; text-transform: uppercase; }
      .as-val { font-family: Georgia, 'Palatino Linotype', Palatino, serif; font-size: 14.5px; font-weight: 700; fill: #E8E4D8; letter-spacing: 0.2px; }
      .as-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 8.5px; font-weight: 500; fill: #8E99A8; }
      .as-sub-muted { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 8.5px; font-weight: 400; fill: #5D6A7D; }
    </style>
  </defs>

  <!-- Container Base -->
  <rect width="900" height="130" fill="#0E1624" stroke="#23314B" stroke-width="1" />

  <!-- TILE 1: JEE ADVANCED -->
  <g transform="translate(14, 12)">
    <rect width="164" height="106" rx="6" fill="#141F33" stroke="#23314B" stroke-width="1" />
    <text x="12" y="22" class="as-tag">NATIONAL</text>
    <text x="12" y="44" class="as-label">ENGINEERING RANK</text>
    <text x="12" y="66" class="as-val" fill="#B08D57">JEE Advanced</text>
    <text x="12" y="84" class="as-sub">Qualified 2X</text>
    <text x="12" y="97" class="as-sub-muted">Years 2024 &amp; 2025</text>
  </g>

  <!-- TILE 2: 100/100 MATHS -->
  <g transform="translate(190, 12)">
    <rect width="164" height="106" rx="6" fill="#141F33" stroke="#23314B" stroke-width="1" />
    <text x="12" y="22" class="as-tag">PERFECT SCORE</text>
    <text x="12" y="44" class="as-label">QUANTITATIVE RIGOR</text>
    <text x="12" y="66" class="as-val" fill="#E8E4D8">100 / 100</text>
    <text x="12" y="84" class="as-sub">Intermediate Mathematics</text>
    <text x="12" y="97" class="as-sub-muted">Analytical Benchmark</text>
  </g>

  <!-- TILE 3: SGPA 9.25 -->
  <g transform="translate(366, 12)">
    <rect width="164" height="106" rx="6" fill="#141F33" stroke="#23314B" stroke-width="1" />
    <text x="12" y="22" class="as-tag">UNIVERSITY</text>
    <text x="12" y="44" class="as-label">ACADEMIC STANDING</text>
    <text x="12" y="66" class="as-val" fill="#E8E4D8">9.25 / 10</text>
    <text x="12" y="84" class="as-sub">Sem 1: 9.23 · Sem 2: 9.25</text>
    <text x="12" y="97" class="as-sub-muted">Pondicherry Univ CSBS</text>
  </g>

  <!-- TILE 4: PRAGYAN NIT TRICHY -->
  <g transform="translate(542, 12)">
    <rect width="164" height="106" rx="6" fill="#141F33" stroke="#23314B" stroke-width="1" />
    <text x="12" y="22" class="as-tag">TECH FEST</text>
    <text x="12" y="44" class="as-label">NATIONAL SUMMIT</text>
    <text x="12" y="66" class="as-val" fill="#E8E4D8">Pragyan</text>
    <text x="12" y="84" class="as-sub">NIT Trichy Participant</text>
    <text x="12" y="97" class="as-sub-muted">Technical Festival</text>
  </g>

  <!-- TILE 5: RENOPAY LIVE ON RENDER -->
  <g transform="translate(718, 12)">
    <rect width="168" height="106" rx="6" fill="#141F33" stroke="#23314B" stroke-width="1" />
    <text x="12" y="22" class="as-tag">DEPLOYED</text>
    <text x="12" y="44" class="as-label">FINTECH ENGINE</text>
    <text x="12" y="66" class="as-val" fill="#B08D57">RenoPay</text>
    <text x="12" y="84" class="as-sub">Live on Render</text>
    <text x="12" y="97" class="as-sub-muted">Docker + Nginx Rails</text>
  </g>
</svg>

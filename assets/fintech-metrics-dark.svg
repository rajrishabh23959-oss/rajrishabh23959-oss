<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 170" width="100%" height="100%">
  <defs>
    <style>
      :root {
        --bg: #0E1624;
        --card: #141F33;
        --border: #23314B;
        --text-primary: #E8E4D8;
        --text-secondary: #8E99A8;
        --text-muted: #5D6A7D;
        --accent: #B08D57;
      }
      .fm-serif { font-family: Georgia, 'Palatino Linotype', Palatino, serif; font-size: 16px; font-weight: 700; fill: #E8E4D8; }
      .fm-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .fm-mono { font-family: -apple-system, BlinkMacSystemFont, 'SF Mono', 'Fira Code', 'Courier New', monospace; }
      
      .fm-tag { font-size: 8.5px; font-weight: 700; fill: #B08D57; letter-spacing: 1.5px; text-transform: uppercase; }
      .fm-sub { font-size: 11px; font-weight: 400; fill: #8E99A8; }
      .fm-metric-label { font-size: 8px; font-weight: 600; fill: #5D6A7D; letter-spacing: 1.2px; text-transform: uppercase; }
      .fm-metric-val { font-family: Georgia, serif; font-size: 13.5px; font-weight: 700; fill: #E8E4D8; }
      .fm-footer { font-size: 8px; font-weight: 600; fill: #5D6A7D; letter-spacing: 1.2px; text-transform: uppercase; }
    </style>
  </defs>

  <!-- Base Container -->
  <rect width="900" height="170" fill="#0E1624" />

  <!-- CARD 1: SENTINAI -->
  <g transform="translate(14, 10)">
    <rect width="278" height="150" rx="6" fill="#141F33" stroke="#23314B" stroke-width="1" />
    <text x="18" y="26" class="fm-mono fm-tag">SPEC 01 // BIOMETRICS</text>
    <text x="18" y="52" class="fm-serif">SentinAI Protocol</text>
    <text x="18" y="70" class="fm-sans fm-sub">Keystroke Dynamic Verification</text>

    <!-- Financial Report Style Progress Bar -->
    <text x="18" y="102" class="fm-mono fm-metric-label">VERIFICATION RATE</text>
    <text x="260" y="102" text-anchor="end" class="fm-metric-val">99.4%</text>
    <line x1="18" y1="110" x2="260" y2="110" stroke="#23314B" stroke-width="2" />
    <line x1="18" y1="110" x2="242" y2="110" stroke="#B08D57" stroke-width="2" />

    <text x="18" y="136" class="fm-mono fm-footer">NATIONAL IDEATHON DEFENSE</text>
  </g>

  <!-- CARD 2: RENOPAY -->
  <g transform="translate(310, 10)">
    <rect width="280" height="150" rx="6" fill="#141F33" stroke="#23314B" stroke-width="1" />
    <text x="18" y="26" class="fm-mono fm-tag">SPEC 02 // PAYMENT ENGINE</text>
    <text x="18" y="52" class="fm-serif">RenoPay Architecture</text>
    <text x="18" y="70" class="fm-sans fm-sub">UPI Lite &amp; Double-Entry Ledger</text>

    <text x="18" y="102" class="fm-mono fm-metric-label">DEPLOYMENT RUNTIME</text>
    <text x="262" y="102" text-anchor="end" class="fm-metric-val" fill="#B08D57">LIVE PROD</text>
    <line x1="18" y1="110" x2="262" y2="110" stroke="#23314B" stroke-width="2" />
    <line x1="18" y1="110" x2="228" y2="110" stroke="#B08D57" stroke-width="2" />

    <text x="18" y="136" class="fm-mono fm-footer">DOCKER · NGINX · RENDER HOSTED</text>
  </g>

  <!-- CARD 3: ACADEMIC & CSBS RIGOR -->
  <g transform="translate(608, 10)">
    <rect width="278" height="150" rx="6" fill="#141F33" stroke="#23314B" stroke-width="1" />
    <text x="18" y="26" class="fm-mono fm-tag">SPEC 03 // QUANTITATIVE</text>
    <text x="18" y="52" class="fm-serif">CSBS Dual Rigor</text>
    <text x="18" y="70" class="fm-sans fm-sub">Mathematics &amp; Financial Accounting</text>

    <text x="18" y="102" class="fm-mono fm-metric-label">ACADEMIC SGPA</text>
    <text x="260" y="102" text-anchor="end" class="fm-metric-val">9.25 / 10</text>
    <line x1="18" y1="110" x2="260" y2="110" stroke="#23314B" stroke-width="2" />
    <line x1="18" y1="110" x2="248" y2="110" stroke="#B08D57" stroke-width="2" />

    <text x="18" y="136" class="fm-mono fm-footer">100/100 MATH · JEE ADVANCED 2X</text>
  </g>
</svg>

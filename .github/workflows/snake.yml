name: Generate Snake Contribution Grid

on:
  # Schedule to run every 12 hours
  schedule:
    - cron: "0 */12 * * *"
  # Allows manual execution from the Actions tab
  workflow_dispatch:
  # Run on push to main branch
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate Contribution Grid Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#B08D57&color_dots=#F9F8F5,#E5E0D5,#C5BEB1,#8E7958,#B08D57
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#B08D57&color_dots=#0E1624,#162238,#23314B,#5D6E8C,#B08D57

      - name: Deploy to Output Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

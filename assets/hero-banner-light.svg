<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CBD5E1" />
      <stop offset="30%" stop-color="#0D9488" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#0284C7" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="textGradLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#0F766E" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- Sparkline Gradient -->
    <linearGradient id="chartGradLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="60%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <linearGradient id="chartAreaLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0D9488" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#0D9488" stop-opacity="0" />
    </linearGradient>
  </defs>

  <style>
    .terminal-title-lt { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace; font-size: 11px; fill: #64748B; font-weight: 700; letter-spacing: 1.5px; }
    .status-text-lt { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace; font-size: 11px; fill: #059669; font-weight: 700; letter-spacing: 1px; }
    .hero-name-lt { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 40px; font-weight: 900; letter-spacing: -0.5px; fill: url(#textGradLight); }
    .hero-sub-lt { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #0F172A; letter-spacing: 0.5px; }
    .hero-desc-lt { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; fill: #475569; }
    .tag-text-lt { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace; font-size: 10px; font-weight: 700; fill: #0D9488; letter-spacing: 0.8px; }
    .metric-val-lt { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; font-weight: 800; fill: #0F172A; }
    .metric-lbl-lt { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace; font-size: 9px; fill: #64748B; font-weight: 700; letter-spacing: 0.6px; }

    @keyframes pulsePointLt {
      0% { r: 3.5px; opacity: 1; }
      50% { r: 7.5px; opacity: 0.2; }
      100% { r: 3.5px; opacity: 1; }
    }
    .pulsing-node-lt {
      animation: pulsePointLt 2.4s infinite ease-in-out;
    }
  </style>

  <!-- Container -->
  <rect x="2" y="2" width="896" height="256" rx="14" fill="url(#bgGradLight)" stroke="url(#borderGradLight)" stroke-width="1.5" />

  <!-- Top Dashboard Bar -->
  <path d="M 2 16 Q 2 2 16 2 L 884 2 Q 898 2 898 16 L 898 38 L 2 38 Z" fill="#F1F5F9" />
  <line x1="2" y1="38" x2="898" y2="38" stroke="#CBD5E1" stroke-width="1" />

  <!-- Window controls -->
  <circle cx="22" cy="20" r="5" fill="#EF4444" />
  <circle cx="38" cy="20" r="5" fill="#F59E0B" />
  <circle cx="54" cy="20" r="5" fill="#10B981" />

  <!-- Terminal Label -->
  <text x="80" y="24" class="terminal-title-lt">RISHABH-TERMINAL // FINTECH &amp; AI INTELLIGENCE SYSTEM</text>

  <!-- Live Status Beacon -->
  <circle cx="750" cy="20" r="4" fill="#059669" />
  <circle cx="750" cy="20" r="7" fill="none" stroke="#059669" stroke-width="1.2" opacity="0.6">
    <animate attributeName="r" values="4;9;4" dur="2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.8;0;0.8" dur="2s" repeatCount="indefinite" />
  </circle>
  <text x="765" y="24" class="status-text-lt">LIVE · 99.98% UPTIME</text>

  <!-- Left Content Area -->
  <rect x="28" y="54" width="370" height="24" rx="12" fill="#F0FDFA" stroke="#0D9488" stroke-width="1" stroke-opacity="0.5" />
  <text x="42" y="70" class="tag-text-lt">◈ B.TECH + MBA (CSBS) · PONDICHERRY UNIVERSITY</text>

  <!-- Name -->
  <text x="28" y="118" class="hero-name-lt">RISHABH RAJ</text>

  <!-- Subtitle -->
  <text x="28" y="145" class="hero-sub-lt">AI &amp; FinTech Analyst · Digital Banking · Fraud Analytics</text>
  <text x="28" y="167" class="hero-desc-lt">Engineering resilient financial rails, keystroke biometrics, and AI-driven double-entry ledgers.</text>

  <!-- Operational Badges (Row) -->
  <g transform="translate(28, 186)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="138" height="48" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
    <text x="12" y="20" class="metric-lbl-lt">ACADEMIC EXCELLENCE</text>
    <text x="12" y="38" class="metric-val-lt" fill="#0284C7">SGPA 9.25 / 10</text>

    <!-- Pill 2 -->
    <rect x="148" y="0" width="144" height="48" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
    <text x="160" y="20" class="metric-lbl-lt">MATHEMATICS RANK</text>
    <text x="160" y="38" class="metric-val-lt" fill="#B45309">100/100 · JEE (2X)</text>

    <!-- Pill 3 -->
    <rect x="302" y="0" width="154" height="48" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
    <text x="314" y="20" class="metric-lbl-lt">CORE PROTOCOLS</text>
    <text x="314" y="38" class="metric-val-lt" fill="#0D9488">UPI · AI BOOKKEEPING</text>
  </g>

  <!-- Right Chart & Telemetry Box -->
  <g transform="translate(496, 52)">
    <rect x="0" y="0" width="374" height="182" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />

    <!-- Grid Lines -->
    <line x1="20" y1="36" x2="354" y2="36" stroke="#E2E8F0" stroke-dasharray="3 3" />
    <line x1="20" y1="76" x2="354" y2="76" stroke="#E2E8F0" stroke-dasharray="3 3" />
    <line x1="20" y1="116" x2="354" y2="116" stroke="#E2E8F0" stroke-dasharray="3 3" />

    <text x="20" y="22" class="terminal-title-lt">BEHAVIORAL RISK &amp; TRANSACTION PULSE</text>
    <text x="280" y="22" class="tag-text-lt" fill="#059669">SENTINAI ACTIVE</text>

    <!-- Sparkline Fill Area -->
    <path d="M 20 120 Q 70 110, 110 85 T 180 95 T 250 50 T 310 65 T 350 40 L 350 148 L 20 148 Z" fill="url(#chartAreaLight)" />

    <!-- Sparkline Path -->
    <path d="M 20 120 Q 70 110, 110 85 T 180 95 T 250 50 T 310 65 T 350 40" fill="none" stroke="url(#chartGradLight)" stroke-width="2.5">
      <animate attributeName="stroke-dasharray" values="0,600; 600,0" dur="2.5s" fill="freeze" />
    </path>

    <!-- Data Nodes -->
    <circle cx="110" cy="85" r="3.5" fill="#0284C7" />
    <circle cx="180" cy="95" r="3.5" fill="#0D9488" />
    <circle cx="250" cy="50" r="3.5" fill="#D97706" />
    <circle cx="350" cy="40" r="4.5" fill="#D97706" />
    <circle cx="350" cy="40" r="8" fill="none" stroke="#D97706" stroke-width="1.5" class="pulsing-node-lt" />

    <!-- Mini Telemetry footer inside chart box -->
    <line x1="10" y1="148" x2="364" y2="148" stroke="#E2E8F0" />
    <text x="20" y="168" class="metric-lbl-lt">TARGET: AI/FINTECH ANALYST</text>
    <text x="210" y="168" class="tag-text-lt">READY FOR DEPLOYMENT →</text>
  </g>
</svg>

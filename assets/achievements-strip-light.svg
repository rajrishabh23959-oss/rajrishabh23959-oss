<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 130" width="100%" height="100%">
  <defs>
    <style>
      :root {
        --bg: #F9F8F5;
        --card: #FFFFFF;
        --border: #DCD8CE;
        --text-primary: #0E1624;
        --text-secondary: #5C6675;
        --text-muted: #8893A2;
        --accent: #B08D57;
      }
      .as-tag-lt { font-family: -apple-system, BlinkMacSystemFont, 'SF Mono', 'Fira Code', monospace; font-size: 8px; font-weight: 700; fill: #B08D57; letter-spacing: 1.2px; text-transform: uppercase; }
      .as-label-lt { font-family: -apple-system, BlinkMacSystemFont, 'SF Mono', 'Fira Code', monospace; font-size: 8px; font-weight: 600; fill: #8893A2; letter-spacing: 1px; text-transform: uppercase; }
      .as-val-lt { font-family: Georgia, 'Palatino Linotype', Palatino, serif; font-size: 14.5px; font-weight: 700; fill: #0E1624; letter-spacing: 0.2px; }
      .as-sub-lt { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 8.5px; font-weight: 500; fill: #5C6675; }
      .as-sub-muted-lt { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 8.5px; font-weight: 400; fill: #8893A2; }
    </style>
  </defs>

  <!-- Container Base -->
  <rect width="900" height="130" fill="#F9F8F5" stroke="#DCD8CE" stroke-width="1" />

  <!-- TILE 1: JEE ADVANCED -->
  <g transform="translate(14, 12)">
    <rect width="164" height="106" rx="6" fill="#FFFFFF" stroke="#DCD8CE" stroke-width="1" />
    <text x="12" y="22" class="as-tag-lt">NATIONAL</text>
    <text x="12" y="44" class="as-label-lt">ENGINEERING RANK</text>
    <text x="12" y="66" class="as-val-lt" fill="#B08D57">JEE Advanced</text>
    <text x="12" y="84" class="as-sub-lt">Qualified 2X</text>
    <text x="12" y="97" class="as-sub-muted-lt">Years 2024 &amp; 2025</text>
  </g>

  <!-- TILE 2: 100/100 MATHS -->
  <g transform="translate(190, 12)">
    <rect width="164" height="106" rx="6" fill="#FFFFFF" stroke="#DCD8CE" stroke-width="1" />
    <text x="12" y="22" class="as-tag-lt">PERFECT SCORE</text>
    <text x="12" y="44" class="as-label-lt">QUANTITATIVE RIGOR</text>
    <text x="12" y="66" class="as-val-lt" fill="#0E1624">100 / 100</text>
    <text x="12" y="84" class="as-sub-lt">Intermediate Mathematics</text>
    <text x="12" y="97" class="as-sub-muted-lt">Analytical Benchmark</text>
  </g>

  <!-- TILE 3: SGPA 9.25 -->
  <g transform="translate(366, 12)">
    <rect width="164" height="106" rx="6" fill="#FFFFFF" stroke="#DCD8CE" stroke-width="1" />
    <text x="12" y="22" class="as-tag-lt">UNIVERSITY</text>
    <text x="12" y="44" class="as-label-lt">ACADEMIC STANDING</text>
    <text x="12" y="66" class="as-val-lt" fill="#0E1624">9.25 / 10</text>
    <text x="12" y="84" class="as-sub-lt">Sem 1: 9.23 · Sem 2: 9.25</text>
    <text x="12" y="97" class="as-sub-muted-lt">Pondicherry Univ CSBS</text>
  </g>

  <!-- TILE 4: PRAGYAN NIT TRICHY -->
  <g transform="translate(542, 12)">
    <rect width="164" height="106" rx="6" fill="#FFFFFF" stroke="#DCD8CE" stroke-width="1" />
    <text x="12" y="22" class="as-tag-lt">TECH FEST</text>
    <text x="12" y="44" class="as-label-lt">NATIONAL SUMMIT</text>
    <text x="12" y="66" class="as-val-lt" fill="#0E1624">Pragyan</text>
    <text x="12" y="84" class="as-sub-lt">NIT Trichy Participant</text>
    <text x="12" y="97" class="as-sub-muted-lt">Technical Festival</text>
  </g>

  <!-- TILE 5: RENOPAY LIVE ON RENDER -->
  <g transform="translate(718, 12)">
    <rect width="168" height="106" rx="6" fill="#FFFFFF" stroke="#DCD8CE" stroke-width="1" />
    <text x="12" y="22" class="as-tag-lt">DEPLOYED</text>
    <text x="12" y="44" class="as-label-lt">FINTECH ENGINE</text>
    <text x="12" y="66" class="as-val-lt" fill="#B08D57">RenoPay</text>
    <text x="12" y="84" class="as-sub-lt">Live on Render</text>
    <text x="12" y="97" class="as-sub-muted-lt">Docker + Nginx Rails</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 180" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGradLt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>

    <linearGradient id="barTealLt" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>

    <linearGradient id="barGoldLt" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <linearGradient id="barCyanLt" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
  </defs>

  <style>
    .card-title-lt { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace; font-size: 11px; fill: #64748B; font-weight: 700; letter-spacing: 1px; }
    .card-headline-lt { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 16px; fill: #0F172A; font-weight: 800; }
    .card-sub-lt { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; fill: #475569; }
    .card-badge-lt { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace; font-size: 9.5px; font-weight: 700; letter-spacing: 0.5px; }
    .metric-val-lt { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace; font-size: 13px; font-weight: 800; }
  </style>

  <!-- CARD 1: FRAUD & BIOMETRICS -->
  <g transform="translate(10, 10)">
    <rect width="280" height="160" rx="10" fill="url(#cardGradLt)" stroke="#CBD5E1" stroke-width="1.2" />
    
    <text x="16" y="26" class="card-title-lt">TELEMETRY 01 // SENTINAI</text>
    <rect x="186" y="14" width="78" height="18" rx="9" fill="#ECFDF5" stroke="#10B981" stroke-width="0.8" />
    <text x="195" y="27" class="card-badge-lt" fill="#059669">IDEATHON</text>

    <text x="16" y="55" class="card-headline-lt">Behavioral Biometrics</text>
    <text x="16" y="73" class="card-sub-lt">Keystroke Dynamics &amp; Risk Profiling</text>

    <text x="16" y="105" class="card-title-lt">VERIFICATION CONFIDENCE</text>
    <text x="210" y="105" class="metric-val-lt" fill="#0D9488">99.4%</text>

    <rect x="16" y="114" width="248" height="6" rx="3" fill="#E2E8F0" />
    <rect x="16" y="114" width="232" height="6" rx="3" fill="url(#barTealLt)">
      <animate attributeName="width" values="40;232" dur="1.8s" fill="freeze" />
    </rect>

    <text x="16" y="145" class="card-badge-lt" fill="#64748B">CONTINUOUS AUTH · ZERO TRUST</text>
  </g>

  <!-- CARD 2: DIGITAL BANKING RAILS -->
  <g transform="translate(310, 10)">
    <rect width="280" height="160" rx="10" fill="url(#cardGradLt)" stroke="#CBD5E1" stroke-width="1.2" />

    <text x="16" y="26" class="card-title-lt">TELEMETRY 02 // RENOPAY</text>
    <rect x="178" y="14" width="86" height="18" rx="9" fill="#EFF6FF" stroke="#0284C7" stroke-width="0.8" />
    <text x="187" y="27" class="card-badge-lt" fill="#0284C7">LIVE PROD</text>

    <text x="16" y="55" class="card-headline-lt">Full-Stack UPI Engine</text>
    <text x="16" y="73" class="card-sub-lt">UPI Lite, Shared Vaults, Ledger Book</text>

    <text x="16" y="105" class="card-title-lt">CONTAINER LATENCY</text>
    <text x="215" y="105" class="metric-val-lt" fill="#0284C7">&lt; 18ms</text>

    <rect x="16" y="114" width="248" height="6" rx="3" fill="#E2E8F0" />
    <rect x="16" y="114" width="215" height="6" rx="3" fill="url(#barCyanLt)">
      <animate attributeName="width" values="30;215" dur="1.8s" fill="freeze" />
    </rect>

    <text x="16" y="145" class="card-badge-lt" fill="#64748B">DOCKER · NGINX · RENDER HOSTED</text>
  </g>

  <!-- CARD 3: QUANTITATIVE & BUSINESS RIGOR -->
  <g transform="translate(610, 10)">
    <rect width="280" height="160" rx="10" fill="url(#cardGradLt)" stroke="#CBD5E1" stroke-width="1.2" />

    <text x="16" y="26" class="card-title-lt">TELEMETRY 03 // ACADEMIC</text>
    <rect x="188" y="14" width="76" height="18" rx="9" fill="#FFFBEB" stroke="#F59E0B" stroke-width="0.8" />
    <text x="197" y="27" class="card-badge-lt" fill="#D97706">HONORS</text>

    <text x="16" y="55" class="card-headline-lt">CSBS Dual Competency</text>
    <text x="16" y="73" class="card-sub-lt">Quantitative Modeling &amp; Accounting</text>

    <text x="16" y="105" class="card-title-lt">MATH &amp; SGPA BENCHMARK</text>
    <text x="210" y="105" class="metric-val-lt" fill="#D97706">9.25 / 10</text>

    <rect x="16" y="114" width="248" height="6" rx="3" fill="#E2E8F0" />
    <rect x="16" y="114" width="236" height="6" rx="3" fill="url(#barGoldLt)">
      <animate attributeName="width" values="50;236" dur="1.8s" fill="freeze" />
    </rect>

    <text x="16" y="145" class="card-badge-lt" fill="#64748B">100/100 MATH · JEE ADVANCED (2X)</text>
  </g>
</svg>
